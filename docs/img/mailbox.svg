<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7a72"/>
    </marker>
  </defs>

  <rect width="780" height="330" fill="#fbfbfa"/>

  <!-- hosts -->
  <rect x="16" y="86" width="150" height="94" rx="3" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="32" y="112" font-size="13" font-weight="600" fill="#141413">host A</text>
  <text x="32" y="132" font-size="10.5" fill="#5c6b7a">node "laptop"</text>
  <text x="32" y="149" font-size="10.5" fill="#5c6b7a">holds account token</text>
  <text x="32" y="166" font-size="10.5" fill="#5c6b7a">holds channel key</text>

  <rect x="614" y="86" width="150" height="94" rx="3" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="630" y="112" font-size="13" font-weight="600" fill="#141413">host B</text>
  <text x="630" y="132" font-size="10.5" fill="#5c6b7a">node "server"</text>
  <text x="630" y="149" font-size="10.5" fill="#5c6b7a">same account token</text>
  <text x="630" y="166" font-size="10.5" fill="#5c6b7a">same channel key</text>

  <!-- mailboxes -->
  <text x="312" y="30" font-size="10" letter-spacing="1.2" fill="#8892a0">TWO PRIVATE ARTIFACTS</text>
  <rect x="290" y="44" width="200" height="56" rx="3" fill="#f0f7f6" stroke="#0f7a72" stroke-width="1.5"/>
  <text x="306" y="66" font-size="12" font-weight="600" fill="#141413">"relay laptop"</text>
  <text x="306" y="84" font-size="10.5" fill="#0f7a72">A publishes &#183; B reads</text>

  <rect x="290" y="166" width="200" height="56" rx="3" fill="#f0f7f6" stroke="#0f7a72" stroke-width="1.5"/>
  <text x="306" y="188" font-size="12" font-weight="600" fill="#141413">"relay server"</text>
  <text x="306" y="206" font-size="10.5" fill="#0f7a72">B publishes &#183; A reads</text>

  <!-- flows -->
  <path d="M166 108 L286 78" fill="none" stroke="#0f7a72" stroke-width="1.75" marker-end="url(#ag)"/>
  <text x="176" y="60" font-size="10.5" fill="#5c6b7a">publish: appends a version</text>

  <path d="M614 108 L494 78" fill="none" stroke="#5c6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="500" y="60" font-size="10.5" fill="#5c6b7a">poll: has ver changed?</text>

  <path d="M614 158 L494 196" fill="none" stroke="#0f7a72" stroke-width="1.75" marker-end="url(#ag)"/>
  <text x="500" y="240" font-size="10.5" fill="#5c6b7a">publish: appends a version</text>

  <path d="M166 158 L286 196" fill="none" stroke="#5c6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="140" y="240" font-size="10.5" fill="#5c6b7a">poll: has ver changed?</text>

  <!-- steady state -->
  <line x1="16" y1="264" x2="764" y2="264" stroke="#dfe4ea" stroke-width="1"/>
  <text x="16" y="288" font-size="10" letter-spacing="1.2" fill="#8892a0">STEADY STATE IS ONE REQUEST</text>
  <text x="16" y="308" font-size="11.5" fill="#141413">GET /api/frame/&lt;slug&gt; returns ver and assetToken together, so an unchanged</text>
  <text x="16" y="323" font-size="11.5" fill="#141413">mailbox costs one call and a changed one costs two. Listing every frame cost 49x the bytes.</text>
</svg>
