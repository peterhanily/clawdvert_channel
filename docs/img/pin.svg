<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
  </defs>

  <rect width="780" height="300" fill="#fbfbfa"/>

  <text x="16" y="28" font-size="10" letter-spacing="1.2" fill="#8892a0">A PUBLIC ARTIFACT SERVES ONE PINNED VERSION, NOT THE NEWEST ONE</text>

  <!-- version chain -->
  <rect x="16" y="52" width="120" height="46" rx="3" fill="#f0f7f6" stroke="#0f7a72" stroke-width="1.5"/>
  <text x="30" y="74" font-size="12" fill="#141413">v1</text>
  <text x="30" y="90" font-size="10" fill="#0f7a72">shared = v1</text>

  <rect x="176" y="52" width="120" height="46" rx="3" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="190" y="74" font-size="12" fill="#141413">v2</text>
  <text x="190" y="90" font-size="10" fill="#5c6b7a">live</text>

  <line x1="136" y1="75" x2="172" y2="75" stroke="#5c6b7a" stroke-width="1.5" marker-end="url(#c)"/>
  <text x="120" y="122" font-size="10.5" fill="#5c6b7a">redeploy appends v2 and moves live, but leaves shared alone</text>

  <!-- what each party sees -->
  <text x="440" y="28" font-size="10" letter-spacing="1.2" fill="#8892a0">WHAT A STRANGER GETS</text>
  <rect x="440" y="52" width="324" height="46" rx="3" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="456" y="72" font-size="11" fill="#141413">GET /_f/&lt;v1&gt;/  &#8594;  200, the old content</text>
  <text x="456" y="90" font-size="11" fill="#141413">GET /_f/&lt;v2&gt;/  &#8594;  403, not readable at all</text>

  <!-- fix -->
  <line x1="16" y1="152" x2="764" y2="152" stroke="#dfe4ea" stroke-width="1"/>
  <text x="16" y="176" font-size="10" letter-spacing="1.2" fill="#8892a0">MOVING THE PIN</text>
  <rect x="16" y="190" width="360" height="62" rx="3" fill="#f0f7f6" stroke="#0f7a72" stroke-width="1.5"/>
  <text x="32" y="212" font-size="11" fill="#141413">PATCH /api/frame/perm/&lt;slug&gt;?org=&lt;uuid&gt;</text>
  <text x="32" y="230" font-size="11" fill="#141413">{"shared": "&lt;v2&gt;"}</text>
  <text x="32" y="246" font-size="10.5" fill="#0f7a72">now v2 serves 200 and v1 returns 403</text>

  <text x="404" y="212" font-size="11.5" fill="#141413">Exactly one version is public at a time.</text>
  <text x="404" y="230" font-size="11.5" fill="#141413">Moving the pin forward also revokes the</text>
  <text x="404" y="248" font-size="11.5" fill="#141413">previous one.</text>

  <text x="16" y="282" font-size="11.5" fill="#5c6b7a">The publish response tells you this is about to happen: it echoes the unchanged "shared" value.</text>
</svg>
