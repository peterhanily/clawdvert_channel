<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
    <marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a4610a"/>
    </marker>
  </defs>

  <rect width="780" height="360" fill="#fbfbfa"/>

  <!-- browser A -->
  <text x="16" y="28" font-size="10" letter-spacing="1.2" fill="#8892a0">BROWSER, DEVICE A</text>
  <rect x="16" y="40" width="250" height="150" rx="3" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="32" y="64" font-size="12" font-weight="600" fill="#141413">artifact page</text>
  <text x="32" y="82" font-size="10.5" fill="#5c6b7a">&lt;slug&gt;.frame.claudeusercontent.com</text>

  <rect x="32" y="94" width="218" height="34" rx="2" fill="#f4f7fa" stroke="#c8cfd8"/>
  <text x="44" y="115" font-size="10.5" fill="#5c6b7a">primary realm: RTCPeerConnection</text>
  <text x="222" y="115" font-size="10.5" font-weight="600" fill="#0f7a72">undefined</text>

  <rect x="32" y="136" width="218" height="40" rx="2" fill="#fdf6ec" stroke="#a4610a" stroke-width="1.5"/>
  <text x="44" y="155" font-size="10.5" fill="#5c6b7a">child realm (iframe, no src)</text>
  <text x="44" y="170" font-size="10.5" font-weight="600" fill="#a4610a">native constructor, usable</text>

  <!-- browser B -->
  <text x="514" y="28" font-size="10" letter-spacing="1.2" fill="#8892a0">BROWSER, DEVICE B</text>
  <rect x="514" y="40" width="250" height="150" rx="3" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="530" y="64" font-size="12" font-weight="600" fill="#141413">same artifact page</text>
  <text x="530" y="82" font-size="10.5" fill="#5c6b7a">same room code</text>
  <rect x="530" y="136" width="218" height="40" rx="2" fill="#fdf6ec" stroke="#a4610a" stroke-width="1.5"/>
  <text x="542" y="155" font-size="10.5" fill="#5c6b7a">child realm</text>
  <text x="542" y="170" font-size="10.5" font-weight="600" fill="#a4610a">native constructor, usable</text>

  <!-- relay -->
  <rect x="300" y="96" width="180" height="66" rx="3" fill="#fff" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="316" y="120" font-size="12" font-weight="600" fill="#141413">your TURN relay</text>
  <text x="316" y="138" font-size="10.5" fill="#5c6b7a">UDP 3478-3483</text>
  <text x="316" y="154" font-size="10.5" fill="#5c6b7a">HMAC nonce auth</text>

  <path d="M250 156 L296 140" fill="none" stroke="#a4610a" stroke-width="1.75" marker-end="url(#bo)"/>
  <path d="M530 156 L484 140" fill="none" stroke="#a4610a" stroke-width="1.75" marker-end="url(#bo)"/>
  <text x="248" y="196" font-size="10.5" fill="#5c6b7a">iceTransportPolicy: "relay", so every packet goes through it</text>

  <!-- what the CSP does and does not stop -->
  <line x1="16" y1="222" x2="764" y2="222" stroke="#dfe4ea" stroke-width="1"/>
  <text x="16" y="246" font-size="10" letter-spacing="1.2" fill="#8892a0">WHY THE PRIMARY REALM IS NOT ENOUGH</text>

  <text x="16" y="270" font-size="11.5" fill="#141413">The page's own CSP sends connect-src 'self', which stops fetch, XHR and WebSocket. It also sends</text>
  <text x="16" y="287" font-size="11.5" fill="#141413">webrtc 'block', but Chromium does not implement that directive, so the enforcement that actually runs</text>
  <text x="16" y="304" font-size="11.5" fill="#141413">is a script setting the constructors to undefined on globalThis, once, at document load.</text>
  <text x="16" y="328" font-size="11.5" fill="#141413">Every child browsing context is a new realm with its own intrinsics, which that script never reaches.</text>
  <text x="16" y="345" font-size="11.5" fill="#5c6b7a">Reported to Anthropic and closed as Informative. See docs/realm-channel.md.</text>
</svg>
