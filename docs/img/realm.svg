<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="title description">
  <title id="title">Clawdvert 0.29 one-invite WebRTC setup</title>
  <desc id="description">The inviter copies one full invite to the joiner. The joiner returns an encrypted compact answer through a six-lane rr2 signalling relay. After candidate deferral and acknowledgement, the browsers open a direct WebRTC data channel or use a separate coturn media relay. Link-hello authenticates room membership.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a4610a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7a72"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fbfbfa"/>
  <text x="16" y="24" font-size="10" letter-spacing="1.2" fill="#8892a0">0.29 SETUP: ONE INVITE, AUTOMATIC ENCRYPTED ANSWER</text>

  <!-- inviter -->
  <rect x="16" y="42" width="242" height="168" rx="4" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="32" y="65" font-size="10" letter-spacing="1.1" fill="#8892a0">BROWSER A · INVITER</text>
  <text x="32" y="88" font-size="12" font-weight="600" fill="#141413">artifact page in child realm</text>
  <line x1="32" y1="100" x2="242" y2="100" stroke="#dfe4ea"/>
  <text x="32" y="123" font-size="10.5" fill="#5c6b7a">1. gathers full offer + candidates</text>
  <text x="32" y="143" font-size="10.5" fill="#5c6b7a">2. waits on exact encrypted answer</text>
  <text x="32" y="163" font-size="10.5" fill="#5c6b7a">3. verifies and applies answer</text>
  <text x="32" y="183" font-size="10.5" fill="#0f7a72">4. ACKs only after application</text>

  <!-- joiner -->
  <rect x="522" y="42" width="242" height="168" rx="4" fill="#fff" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="538" y="65" font-size="10" letter-spacing="1.1" fill="#8892a0">BROWSER B · JOINER</text>
  <text x="538" y="88" font-size="12" font-weight="600" fill="#141413">same artifact, no account needed</text>
  <line x1="538" y1="100" x2="748" y2="100" stroke="#dfe4ea"/>
  <text x="538" y="123" font-size="10.5" fill="#5c6b7a">1. pastes one full invite</text>
  <text x="538" y="143" font-size="10.5" fill="#5c6b7a">2. defers inviter candidates</text>
  <text x="538" y="163" font-size="10.5" fill="#5c6b7a">3. sends encrypted compact answer</text>
  <text x="538" y="183" font-size="10.5" fill="#0f7a72">4. adds candidates after ACK</text>

  <!-- single human transfer -->
  <text x="390" y="48" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".6" fill="#5c6b7a">FULL INVITE · COPIED ONCE</text>
  <path d="M262 62 L518 62" fill="none" stroke="#5c6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="390" y="80" text-anchor="middle" font-size="8.8" fill="#5c6b7a">offer + room identity/channels + media TURN config</text>
  <text x="390" y="94" text-anchor="middle" font-size="8.8" fill="#5c6b7a">+ one-use automatic-answer secret</text>

  <!-- constrained signalling plane -->
  <rect x="296" y="103" width="188" height="104" rx="4" fill="#fdf6ec" stroke="#a4610a" stroke-width="1.5"/>
  <text x="390" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">rr2 signalling relay</text>
  <text x="390" y="146" text-anchor="middle" font-size="10.5" fill="#5c6b7a">six UDP metadata lanes</text>
  <text x="390" y="165" text-anchor="middle" font-size="10.5" fill="#5c6b7a">latest-value answer slot</text>
  <text x="390" y="184" text-anchor="middle" font-size="10.5" fill="#a4610a">answer encrypted end to end</text>

  <path d="M520 132 L488 132" fill="none" stroke="#a4610a" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="504" y="122" text-anchor="middle" font-size="9" fill="#a4610a">answer</text>
  <path d="M294 181 L262 181" fill="none" stroke="#a4610a" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="278" y="171" text-anchor="middle" font-size="9" fill="#a4610a">ACK</text>

  <!-- fast direct path -->
  <text x="390" y="235" text-anchor="middle" font-size="10" letter-spacing="1.1" fill="#8892a0">FAST PLANE AFTER SIGNALLING</text>
  <path d="M138 260 L642 260" fill="none" stroke="#0f7a72" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <rect x="261" y="245" width="258" height="30" rx="3" fill="#fbfbfa"/>
  <text x="390" y="257" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f7a72">preferred: direct WebRTC data channel</text>
  <text x="390" y="272" text-anchor="middle" font-size="9.5" fill="#5c6b7a">DTLS + SCTP · link-hello proves membership</text>

  <!-- media TURN fallback -->
  <rect x="288" y="304" width="204" height="61" rx="4" fill="#f4f7fa" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="390" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">coturn media relay</text>
  <text x="390" y="348" text-anchor="middle" font-size="10.5" fill="#5c6b7a">fallback when no direct route works</text>
  <path d="M137 212 L137 334 L284 334" fill="none" stroke="#5c6b7a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M643 212 L643 334 L496 334" fill="none" stroke="#5c6b7a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <line x1="16" y1="390" x2="764" y2="390" stroke="#dfe4ea"/>
  <text x="16" y="410" font-size="10.5" fill="#141413">The metadata relay bootstraps WebRTC; coturn carries encrypted WebRTC packets only when needed.</text>
  <text x="16" y="425" font-size="10.5" fill="#5c6b7a">A collapsed manual answer + Start barrier remains available if automatic return cannot complete.</text>
</svg>
