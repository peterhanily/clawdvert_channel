services:
  realm-relay:
    build: .
    restart: unless-stopped
    environment:
      NONCE_SECRET: ${NONCE_SECRET:?set NONCE_SECRET in .env}
      RELAY_REALM: ${RELAY_REALM:-realm-relay}
      RELAY_START_PORT: 3478
      RELAY_LANES: 6
      RELAY_RATE_PER_SECOND: ${RELAY_RATE_PER_SECOND:-120}
      RELAY_RATE_BURST: ${RELAY_RATE_BURST:-240}
      PERSIST_MESSAGES: ${PERSIST_MESSAGES:-false}
      MESSAGE_STORE: /data/events.jsonl
      CANARY_LOG: ${CANARY_LOG:-false}
      CANARY_KEEP: ${CANARY_KEEP:-500}
      RENDEZVOUS_V2_SLOTS: ${RENDEZVOUS_V2_SLOTS:-false}
      RENDEZVOUS_V2_MAX_SLOTS: ${RENDEZVOUS_V2_MAX_SLOTS:-1000}
      RENDEZVOUS_V2_MAX_SLOTS_PER_ROOM: ${RENDEZVOUS_V2_MAX_SLOTS_PER_ROOM:-64}
      RENDEZVOUS_V2_SLOT_TTL_MS: ${RENDEZVOUS_V2_SLOT_TTL_MS:-300000}
      RENDEZVOUS_V2_TERMINAL_TTL_MS: ${RENDEZVOUS_V2_TERMINAL_TTL_MS:-300000}
      RENDEZVOUS_V2_READER_LEASE_MS: ${RENDEZVOUS_V2_READER_LEASE_MS:-60000}
    ports:
      - "3478-3483:3478-3483/udp"
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - relay-data:/data

volumes:
  relay-data:
